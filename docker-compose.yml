version: '3.8'

services:
  phishing-detector:
    build: .
    container_name: cyberguard-phishing-detector
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_DEBUG=False
    volumes:
      - ./database:/app/database
      - ./models:/app/models
      - ./templates:/app/templates
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
